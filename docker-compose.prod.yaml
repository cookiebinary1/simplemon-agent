services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile  # Use production Dockerfile instead of Dockerfile.dev
    volumes: []  # No volume mounts in production - code runs from image
    environment:
      - GO_ENV=production
    # Remove tty in production
    tty: false
    # Production-specific settings
    restart: unless-stopped
    # Add resource limits for production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

