name: Release

# Runs when a version tag (v1.2.3) is pushed. Builds the Linux binaries,
# publishes them with SHA256SUMS and signs a build provenance attestation.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write     # create the release
  id-token: write     # sign the attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Newest patch release, so binaries always carry current security fixes.
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Build
        run: |
          version=$GITHUB_REF_NAME
          commit=$(git rev-parse --short HEAD)
          ldflags="-s -w -X main.version=$version -X main.commit=$commit"
          mkdir dist
          build() { # GOARCH, asset name
            CGO_ENABLED=0 GOOS=linux GOARCH=$1 GOARM=6 \
              go build -trimpath -ldflags "$ldflags" -o "dist/$2" ./cmd/simplemon-agent
          }
          build amd64 simplemon-linux-amd64
          build arm64 simplemon-linux-arm64
          build arm   simplemon-linux-arm    # ARMv6 build, runs on ARMv6 and ARMv7
          build 386   simplemon-linux-x86
          printf '{"version":"%s","commit":"%s","built_at":"%s"}\n' \
            "$version" "$commit" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/agent-version.json
          cp LICENSE THIRD_PARTY_LICENSES.md dist/
          (cd dist && sha256sum simplemon-linux-* > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/simplemon-linux-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ $GITHUB_REF_NAME == *-* ]] && flags+=(--prerelease)  # v1.2.3-rc.1
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
